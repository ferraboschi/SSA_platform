# CI — the platform's safety net. Every push/PR to main must pass:
#   typecheck (tsc) + lint (eslint) + 500+ unit tests (vitest) + production build.
# Render is configured to auto-deploy main ONLY after these checks pass, so
# broken code can never reach production ("mai più come stamattina").
#
# No secrets are needed: the app's config degrades gracefully when env vars are
# absent (Supabase/Shopify/Airtable clients report "not configured"), and the
# in-app sync scheduler is disabled via SYNC_CRON_DISABLED, exactly like the
# local test setup.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYNC_CRON_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec eslint

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Production build
        run: pnpm exec next build
