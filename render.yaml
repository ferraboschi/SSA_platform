# Render Blueprint — deploys the SSA platform as a Node web service.
#
# Setup: in Render → New → Blueprint → connect this repo. Render reads this
# file and pre-fills build/start commands. Then enter the secret env vars
# (marked `sync: false`) in the Render dashboard — their values are NOT
# committed here for security.

services:
  - type: web
    name: ssa-platform
    runtime: node
    plan: free            # upgrade to "starter" later to avoid cold starts
    region: frankfurt     # closest to Italy
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /login
    domains:
      - platform.sakesommelierassociation.it
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: EMBEDDINGS_MODEL
        value: text-embedding-3-small
      - key: USE_SEED
        value: "false"
      - key: APP_BASE_URL
        value: https://platform.sakesommelierassociation.it
      # Shared secret guarding /api/sync/shopify (cron uses the same value).
      - key: SYNC_SECRET
        sync: false
      # ---- Secrets: enter values in the Render dashboard ----
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
      # Airtable (online exam system: questions, students, answers)
      - key: AIRTABLE_BASE_ID
        value: appj4DEH3RYFqct1Q
      - key: AIRTABLE_API_KEY
        sync: false
      # Airtable "Master product list" — product costs (same token, 2nd base)
      - key: AIRTABLE_PRICES_BASE_ID
        value: appwCWGRd0jXOCxMA
      # Sake Company (second Shopify store — supplier catalog)
      - key: SAKECOMPANY_STORE_DOMAIN
        sync: false
      - key: SAKECOMPANY_ADMIN_TOKEN
        sync: false
      - key: DROPBOX_ACCESS_TOKEN
        sync: false
      - key: EMBEDDINGS_API_KEY
        sync: false

  # Continuous Shopify → platform sync. Hits the web service's sync endpoint
  # every 10 minutes; the endpoint pulls only orders changed since the last run,
  # so each tick is cheap. The top-bar refresh button triggers the same sync
  # on demand. Set SYNC_SECRET to the SAME value as the web service.
  - type: cron
    name: ssa-shopify-sync
    runtime: node
    region: frankfurt
    branch: main
    schedule: "*/10 * * * *"
    buildCommand: "echo no build needed"
    startCommand: "node -e \"fetch(process.env.SYNC_ENDPOINT+'?token='+encodeURIComponent(process.env.SYNC_SECRET),{method:'POST'}).then(r=>r.text()).then(t=>console.log(t)).catch(e=>{console.error(e);process.exit(1)})\""
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: SYNC_ENDPOINT
        value: https://ssa-platform.onrender.com/api/sync/shopify
      - key: SYNC_SECRET
        sync: false
